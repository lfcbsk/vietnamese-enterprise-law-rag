[project]
name = "vietnamese-enterprise-law-rag"
version = "0.1.0"
description = "RAG cho văn bản pháp luật doanh nghiệp Việt Nam"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Đọc PDF và OCR
    "pymupdf==1.28.0",

    # Embedding, dense index và BM25 index
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.6.0",
    "torch==2.13.0",

    # API và cấu hình
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.51.0",

    # RAG, Gemini và SQLite checkpointer
    "langchain-core==1.4.9",
    "langchain-google-genai==4.2.7",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",

    # Giao diện Gradio được mount trực tiếp vào FastAPI
    "gradio==6.20.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
